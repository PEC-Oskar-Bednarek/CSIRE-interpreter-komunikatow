name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build Windows x64 ZIP
        run: python tools/build_windows.py
      - name: Verify packaged runtime and archive
        run: python tools/check_windows_package.py output/Interpreter-CSIRE-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Interpreter-CSIRE-Windows-x64
          path: output/Interpreter-CSIRE-Windows-x64.zip
          if-no-files-found: error
      - name: Publish ZIP to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME output/Interpreter-CSIRE-Windows-x64.zip --verify-tag --generate-notes
